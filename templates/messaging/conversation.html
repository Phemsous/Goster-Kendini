<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ other_user.username }} ile Sohbet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        .navbar { background-color: #1a1a1a; }
        .chat-box {
            height: 60vh;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bubble {
            max-width: 65%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .bubble-sent {
            background: #dc3545;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bubble-received {
            background: #2a2a2a;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .bubble-time {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 3px;
        }
        .message-input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            border-radius: 25px;
            padding: 12px 20px;
            resize: none;
        }
        .message-input:focus {
            background: #222;
            border-color: #dc3545;
            color: white;
            box-shadow: none;
        }
        .btn-send {
            background: #dc3545;
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .btn-send:hover { background: #bb2d3b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="/">GÖSTER KENDİNİ</a>
            <span class="text-white fw-bold">{{ other_user.username }} ile sohbet</span>
            <a href="{% url 'inbox' %}" class="btn btn-outline-light btn-sm">← Geri</a>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 700px;">
        <div class="chat-box" id="chatBox">
            {% for msg in messages %}
            <div class="d-flex flex-column {% if msg.sender == request.user %}align-items-end{% else %}align-items-start{% endif %}">
                <div class="bubble {% if msg.sender == request.user %}bubble-sent{% else %}bubble-received{% endif %}">
                    {{ msg.content }}
                </div>
                <div class="bubble-time {% if msg.sender == request.user %}text-end{% endif %}">
                    {{ msg.created_at|date:"d M H:i" }}
                </div>
            </div>
            {% empty %}
            <div class="text-center text-muted my-auto">
                Henüz mesaj yok. İlk mesajı sen gönder!
            </div>
            {% endfor %}
        </div>

        <form method="POST" class="d-flex align-items-center gap-2 mt-3">
            {% csrf_token %}
            <textarea name="content" class="form-control message-input" 
                      rows="1" placeholder="Mesaj yaz..." 
                      onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); this.form.submit();}"></textarea>
            <button type="submit" class="btn btn-send">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                </svg>
            </button>
        </form>
    </div>

    <script>
        // Sohbeti en alta kaydır
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
